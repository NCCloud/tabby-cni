---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tabby-operator
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cloud.spaceship.com
  resources:
  - networkattachments
  - networks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloud.spaceship.com
  resources:
  - networkattachments/finalizers
  - networks/finalizers
  verbs:
  - update
- apiGroups:
  - cloud.spaceship.com
  resources:
  - networkattachments/status
  - networks/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachineinstances
  verbs:
  - get
  - list
  - watch
